name: Verify and publish approved A04 source
on:
  push:
    branches: [feature/a04-single-source]
permissions:
  contents: write
concurrency:
  group: a04-single-source-bootstrap
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/a04-single-source'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Reconstruct and verify exact locally tested source
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os, shutil, subprocess
          from pathlib import Path
          root = Path('.github/a04-transfer')
          parts = sorted(root.glob('part-*.txt'))
          assert [p.name for p in parts] == [f'part-{i:02d}.txt' for i in range(41)]
          payload = b''.join(p.read_bytes() for p in parts)
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          expected = '075c3c5e5527015d655ee8b27a11ee50f19fc3ba760886bd441f8d8882b7c23b'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch content hash mismatch'
          path = Path(os.environ['RUNNER_TEMP']) / 'a04-implementation.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero',str(path)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(path)],check=True)
          shutil.rmtree(root)
          Path('.github/workflows/a04-single-source-bootstrap.yml').unlink()
          subprocess.run(['git','add','--all'],check=True)
          tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree == '4cfb3e031cf3ca1107b3afbfa9ca8dfc6ff8f02e', tree
          print('Exact source tree verified:',tree)
          PY
      - run: npm ci
      - name: All existing and single-source regressions
        run: set -o pipefail; npm test | tee "$RUNNER_TEMP/a04-unit-tests.log"
      - name: Typecheck, production and standalone builds
        run: npm run build
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Real browser single-source acceptance
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/a04-http.log" 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" || true' EXIT
          python qa/project-browser-check.py http://127.0.0.1:4173
      - name: Commit and publish only the verified isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 4cfb3e031cf3ca1107b3afbfa9ca8dfc6ff8f02e
          git diff --exit-code
          git diff --cached --check
          git config user.name 'Leo'
          git config user.email 's950329@hotmail.com'
          git commit -m 'feat: implement one-source A04 control and project runtime (WIRE-R14)' -m 'Integrate the existing project-format branch without replacing its history. Add opt-in line-to-line supply matching, remove normal runtime CONTROL and power toggles, enforce single-source imports, route all four fuse terminals, and retain actual QF1 contact behavior. Verified exact source tree, full suite, builds and real browser acceptance before this commit.'
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" push origin HEAD:refs/heads/feature/a04-single-source
          mkdir -p qa-results
          git rev-parse HEAD > qa-results/verified-commit.txt
          git rev-parse HEAD^{tree} > qa-results/verified-tree.txt
          git archive --format=zip --output="$RUNNER_TEMP/wiring-panel-WIRE-R14-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-source-verification
          retention-days: 7
          path: |
            qa-results/
            dist/
            downloads/
            ${{ runner.temp }}/a04-unit-tests.log
            ${{ runner.temp }}/a04-http.log
            ${{ runner.temp }}/wiring-panel-WIRE-R14-source.zip
