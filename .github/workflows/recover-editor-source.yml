name: Recover interrupted editor source
on:
  push:
    branches: [chore/recover-editor-20260918]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=editor-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-editor-source
          path: editor-source.zip
          retention-days: 1
