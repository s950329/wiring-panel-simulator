name: Verify single-source wiring board
on:
  push:
    branches: [main, feature/project-format-v1, feature/a04-single-source]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: set -o pipefail; npm test | tee unit-tests.log
      - run: npm run build
      # The project owner performs browser/WebGL acceptance; CI verifies the
      # electrical model, actual routing geometry, and shared/offline builds.
      - name: Package verified source
        run: |
          git archive --format=zip --output=wiring-panel-source.zip HEAD
          git rev-parse HEAD > verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-source-verification
          path: |
            qa-results/
            dist/
            downloads/
            unit-tests.log
            verified-commit.txt
            wiring-panel-source.zip
          retention-days: 7
